# Plain-HTTP front end. Two jobs: serve the app, and answer the ACME challenge so certbot can
# issue the first certificate. Switch to app-ssl.conf (NGINX_CONF in .env.prod) once it has.
#
# Note what is NOT here: X-Forwarded-Proto. The app redirects to https when it sees that header set
# to "http" (src/server/main-production.ts), so sending it in HTTP-only mode would bounce every
# request to a port nothing is listening on.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream warsworld_app {
  server app:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Let's Encrypt http-01 challenge — must stay reachable on port 80 for renewals.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  client_max_body_size 10m;

  location / {
    proxy_pass http://warsworld_app;
    proxy_http_version 1.1;

    # WebSocket upgrade: the tRPC subscription rides the same origin and port as the app.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;

    # Live matches hold an idle socket between turns — do not cut them at the default 60s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
