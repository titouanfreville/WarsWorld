# TLS front end. Enable it AFTER certbot has issued the certificate, by setting
# NGINX_CONF=app-ssl.conf in .env.prod and re-creating the nginx service. Nginx refuses to start
# when ssl_certificate points at a file that does not exist yet, which is why this is a swap and
# not the default.
#
# Replace <DOMAIN> below with the exact name you issued the certificate for — the sslip.io host
# (e.g. 203-0-113-7.sslip.io) or your real domain once you have one.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream warsworld_app {
  server app:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name <DOMAIN>;

  # Renewals keep using http-01, so this must stay above the redirect.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name <DOMAIN>;

  ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 10m;

  location / {
    proxy_pass http://warsworld_app;
    proxy_http_version 1.1;

    # WebSocket upgrade: the tRPC subscription rides the same origin and port as the app.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    # https here, so the app's http→https guard stays quiet and NextAuth builds secure callbacks.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live matches hold an idle socket between turns — do not cut them at the default 60s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
