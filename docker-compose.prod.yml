# Production stack for a single small VPS: app + Postgres + nightly backups + TLS terminator.
#
# Deliberately ONE box. The app cannot be scaled horizontally — `matchStore` holds live match state
# in process memory and the emitters hold WebSocket subscriber handles, so a second replica would be
# a second, divergent world. Co-locating Postgres also removes the managed-database storage cliff:
# the event log is append-only and grows ~80 MB/month, which is a problem against a 500 MB free tier
# and a non-issue against a 40 GB disk.
#
# Usage:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app npm run prisma:deploy
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app npm run prisma:seed:reference

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No `ports:` on purpose — Postgres is reachable only over the compose network. Publishing it
    # would expose the database to the internet on a VPS with a public IP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Build-time, not runtime — see the Dockerfile comment.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN to the deployed origin}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    # No `ports:` — Caddy is the only thing the internet talks to.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN (the public hostname)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly `pg_dump`. Crude on purpose: a sleep loop has no scheduler to misconfigure and no extra
  # image to trust. See ops/backup-db.sh — and read the offsite warning in docs/deployment.md,
  # because dumps sitting on the same disk as the database are not a backup.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./ops/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'while true; do /usr/local/bin/backup-db.sh || echo "[backup] FAILED"; sleep "$${BACKUP_INTERVAL_SECONDS}"; done',
      ]

volumes:
  db_data:
  caddy_data:
  caddy_config:
