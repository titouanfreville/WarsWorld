# WarsWorld production stack (single Hetzner box).
#
# Always pass the env file explicitly — it feeds BOTH compose interpolation and the containers:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d --build
#
# Services:
#   postgres  the database (volume-backed, reachable on the host only through the SSH tunnel)
#   app       Next + tRPC + the WebSocket, one process on :3000, never published directly
#   nginx     the only thing bound to 0.0.0.0 — terminates TLS, upgrades WebSockets
#   certbot   Let's Encrypt issuance/renewal over the shared webroot
#   migrate   one-shot task container (profile "tools"): migrations, seeds, prisma studio

name: warsworld

x-app-env:
  &app-env # Derived from ONE source of truth so the app can never disagree with the DB it just created.
  DATABASE_URL: postgresql://${POSTGRES_USER:-warsworld}:${PGPASSWORD:?PGPASSWORD is required}@postgres:5432/${POSTGRES_DB:-warsworld}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warsworld}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-warsworld}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Loopback only. Reach it from your laptop with:
    #   ssh -L 5432:127.0.0.1:5432 root@<server-ip>
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warsworld} -d ${POSTGRES_DB:-warsworld}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — changing these needs a rebuild, not a restart.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
        NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-warn}
    image: warsworld-app:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Swap to app-ssl.conf (via .env.prod) once certbot has issued the certificate.
      - ./deployment/nginx/${NGINX_CONF:-app-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - frontend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Renewal only. First issuance is a manual `run --rm --entrypoint certbot certbot certonly …`
    # (see docs/deployment.md) — a cert that does not exist yet cannot be renewed.
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # One-shot task runner: same image as `app`, so it has the prisma CLI, tsx and the full source.
  #   docker compose --env-file .env.prod -f docker-compose.prod.yaml run --rm migrate
  migrate:
    image: warsworld-app:latest
    profiles:
      - tools
    restart: "no"
    env_file:
      - .env.prod
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "prisma:deploy"]
    networks:
      - backend

networks:
  # `backend` has no route to nginx; only `app` sits on both.
  backend:
  frontend:

volumes:
  db_data:
  certbot_www:
  letsencrypt:
